name: macOS Qt smoke test (experimental)

on:
  pull_request:
    branches:
      - main
    paths:
      - "core/**"
      - "config/**"
      - "localization/**"
      - "qt_ui/**"
      - "assets/**"
      - "scripts/build_qt_macos.sh"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/macos-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64-smoke:
    runs-on: macos-14
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      WIZZ_DEV_VIRTUAL_BULBS: "2"
      WIZZ_QT_LANGUAGE: en
      WIZZ_QT_WIDTH: "1440"
      WIZZ_QT_HEIGHT: "960"
      WIZZ_CONFIG_DIR: ${{ github.workspace }}/build/macos-smoke-config

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install macOS Qt and build dependencies
        run: python -m pip install -r requirements-qt-macos.txt -r requirements-dev.txt -r requirements-build.txt

      - name: Build the experimental .app and run focused tests
        run: bash scripts/build_qt_macos.sh --output "$RUNNER_TEMP/macos-build" --release-dir "$RUNNER_TEMP/macos-release"

      - name: Capture all app sections and the Quick Panel
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/macos-build/WizZDesktop.app/Contents/MacOS/WizZDesktop"
          shots="$RUNNER_TEMP/macos-smoke-shots"
          mkdir -p "$shots"
          for page in 0 1 2 3 4 5 6; do
            WIZZ_QT_PAGE="$page" WIZZ_QT_SCREENSHOT="$shots/page-$page.png" "$app"
            test -s "$shots/page-$page.png"
          done
          WIZZ_QT_QUICK_PANEL=1 WIZZ_QT_SCREENSHOT="$shots/quick-panel.png" "$app"
          test -s "$shots/quick-panel.png"

      - name: Upload experimental Mac archive and visual captures
        uses: actions/upload-artifact@v4
        with:
          name: WizZDesktop-macos-arm64-experimental
          path: |
            ${{ runner.temp }}/macos-release/*.zip
            ${{ runner.temp }}/macos-release/*.sha256
            ${{ runner.temp }}/macos-smoke-shots/*.png
          if-no-files-found: error
          retention-days: 14
