name: macOS Qt smoke test (experimental)

on:
  push:
    branches:
      - "codex/macos-smoke-support"
  pull_request:
    branches:
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64-smoke:
    runs-on: macos-14
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      WIZZ_DEV_VIRTUAL_BULBS: "2"
      WIZZ_QT_LANGUAGE: en
      WIZZ_QT_PAGE: "1"
      WIZZ_CONFIG_DIR: ${{ github.workspace }}/build/macos-smoke-config
      WIZZ_QT_SCREENSHOT: ${{ github.workspace }}/macos-smoke.png

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install macOS Qt and build dependencies
        run: python -m pip install -r requirements-qt-macos.txt -r requirements-dev.txt -r requirements-build.txt

      - name: Build the experimental .app and run focused tests
        run: bash scripts/build_qt_macos.sh --output "$RUNNER_TEMP/macos-build" --release-dir "$RUNNER_TEMP/macos-release"

      - name: Launch packaged app with virtual lights and capture its UI
        run: "$RUNNER_TEMP/macos-build/WizZDesktop.app/Contents/MacOS/WizZDesktop"

      - name: Upload unsigned test app and screenshot
        uses: actions/upload-artifact@v4
        with:
          name: WizZDesktop-macos-arm64-experimental
          path: |
            ${{ runner.temp }}/macos-build/WizZDesktop.app
            ${{ runner.temp }}/macos-release/*.zip
            ${{ runner.temp }}/macos-release/*.sha256
            ${{ github.workspace }}/macos-smoke.png
          if-no-files-found: error
          retention-days: 14
