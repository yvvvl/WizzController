name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Linux tray build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libegl1 libgirepository1.0-dev \
            gir1.2-ayatanaappindicator3-0.1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile Python files
        run: python -m compileall -q main.py app_meta.py core config qt_ui tests tools

      - name: Check tracked files and critical Python errors
        run: |
          python tools/repository_hygiene.py
          python tools/i18n_audit.py --strict
          python -m ruff check . --select E9,F63,F7,F82

      - name: Run tests
        run: python -m pytest -q
