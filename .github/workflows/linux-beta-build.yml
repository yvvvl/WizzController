name: Linux beta build

on:
  push:
    branches:
      - feature/v1.2.0-linux-beta
      - "release/**"
  pull_request:
    paths:
      - "**.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - "scripts/build_linux.sh"
      - ".github/workflows/linux-beta-build.yml"

permissions:
  contents: read

jobs:
  package-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Qt Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils patchelf libdbus-1-3 libegl1 libfontconfig1 libgl1 \
            libglib2.0-0 libnss3 libopengl0 libxkbcommon0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-build.txt

      - name: Test and package Linux Qt beta
        run: bash scripts/build_qt_linux.sh --arch ${{ matrix.architecture }} --output dist/linux

      - name: Verify application-menu installer
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/wizz-xdg-data"
          bash dist/linux/WizZDesktop/install.sh

          desktop_file="$XDG_DATA_HOME/applications/io.github.yvvvl.wizz-controller.desktop"
          installed_app="$XDG_DATA_HOME/WizZDesktop/WizZDesktop"
          test -f "$desktop_file"
          test -x "$installed_app"
          grep -F "Exec=$installed_app" "$desktop_file"
          grep -F "Icon=$XDG_DATA_HOME/WizZDesktop/assets/icon.png" "$desktop_file"

          bash "$XDG_DATA_HOME/WizZDesktop/uninstall.sh"
          test ! -e "$desktop_file"
          test ! -e "$XDG_DATA_HOME/WizZDesktop"

      - uses: actions/upload-artifact@v4
        with:
          name: WizZDesktop-linux-${{ matrix.architecture }}
          path: |
            dist/linux
            dist/release/*.tar.gz
            dist/release/*.tar.gz.sha256
          if-no-files-found: error
