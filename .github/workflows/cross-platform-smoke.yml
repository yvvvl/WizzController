name: Cross-platform smoke

on:
  push:
    branches:
      - main
      - "feature/cross-platform-foundation-phase2"
  pull_request:

permissions:
  contents: read

jobs:
  platform-boundary:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install platform-boundary test dependencies
        run: python -m pip install "pytest>=8.0" "pystray>=0.19.5" "Pillow>=10.0.0"

      - name: Compile platform boundary
        run: python -m compileall -q core/platform tests/test_platform_capabilities.py tests/test_platform_linux.py

      - name: Run platform boundary tests
        run: python -m pytest -q tests/test_platform_capabilities.py tests/test_platform_linux.py
