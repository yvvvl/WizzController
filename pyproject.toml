[project]
name = "wizz-controller"
version = "1.5.0"
description = "Control local de ampolletas WiZ por LAN."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
  { name = "Ignacio" },
]
dependencies = [
  # Used by the Qt controller for WiZ discovery, capability probing and
  # color conversion; its MIT notice is bundled with release artifacts.
  "pywizlight==0.6.3",
  "psutil>=5.9",
  "keyboard>=0.13.5",
  "pystray>=0.19.5",
  "Pillow>=10.0.0",
  "certifi==2026.6.17",
  "PySide6==6.9.3",
  "pycairo==1.26.1; sys_platform == 'linux'",
  "PyGObject==3.48.2; sys_platform == 'linux'",
]

[tool.setuptools.packages.find]
# Explicit discovery excludes assets, logs and documentation from Python packages.
include = ["core*", "config*", "qt_ui*", "localization*"]

[tool.setuptools.package-data]
qt_ui = ["qml/*.qml", "qml/qmldir"]
