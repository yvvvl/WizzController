[project]
name = "wizz-controller"
version = "1.4.0b5"
description = "Control local de ampolletas WiZ por LAN."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
  { name = "Ignacio" },
]
dependencies = [
  # Imported by the isolated legacy module; never used by the Qt entrypoint
  # or included in the Qt release artifact.
  "flet==0.85.2",
  "pywizlight==0.6.3",
  "psutil>=5.9",
  "keyboard>=0.13.5",
  "pystray>=0.19.5",
  "Pillow>=10.0.0",
  "certifi==2026.6.17",
  "PySide6==6.9.3",
  "pycairo==1.26.1; sys_platform == 'linux'",
  "PyGObject==3.48.2; sys_platform == 'linux'",
]

[project.optional-dependencies]
# Retained only for developers who need to inspect or migrate the old UI.
legacy-flet = ["flet==0.85.2"]

[tool.setuptools.packages.find]
# Explicit discovery makes optional extras installable from this flat-layout
# repository without treating assets, logs or documentation as Python packages.
include = ["core*", "config*", "ui*", "qt_ui*", "localization*"]

[tool.setuptools.package-data]
qt_ui = ["qml/*.qml", "qml/qmldir"]
